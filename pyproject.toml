[project]
name = "yield-dashboard"
version = "0.1.0"
description = "Yield monitoring dashboard: SQLite store, SPC run rules, yield models, Streamlit UI"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "streamlit>=1.40", "plotly>=5.20"]

[project.optional-dependencies]
classify = ["torch>=2.5"]  # only for yielddash.classify
dev = ["pytest"]

[tool.setuptools]
packages = ["yielddash"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
